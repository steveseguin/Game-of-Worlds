<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>01 Probing</title>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5H4" stroke="#b9d7d8" stroke-opacity=".08"/></pattern>
    <pattern id="stripe" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="18" fill="#e85d3f" fill-opacity=".28"/></pattern>
  </defs>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#46d4df"/></marker></defs>
  <rect width="960" height="540" rx="24" fill="#05080c"/>
  <rect x="14" y="14" width="932" height="512" rx="18" fill="#0a1117" stroke="#52656d" stroke-width="4"/>
  <rect width="960" height="540" fill="url(#scan)"/>
  <text x="48" y="70" fill="#d8e1df" font-family="Arial, sans-serif" font-size="34" font-weight="700">PROBING</text>
  <text x="48" y="108" fill="#8fa3a8" font-family="Arial, sans-serif" font-size="20">Spend reckoning to buy a dated fact before risking a fleet.</text>
  <circle cx="190" cy="320" r="92" fill="#111a22" stroke="#52656d" stroke-width="5" stroke-dasharray="12 10"/><text x="138" y="328" fill="#8fa3a8" font-family="Arial" font-size="24">UNKNOWN</text><path d="M310 320H626" stroke="#46d4df" stroke-width="7" marker-end="url(#arrow)"/><path d="M432 286L476 320 432 354Z" fill="#46d4df"/><circle cx="770" cy="320" r="92" fill="#10212a" stroke="#46d4df" stroke-width="5"/><path d="M706 340Q770 242 834 340" fill="none" stroke="#d5b76a" stroke-width="7"/><text x="716" y="398" fill="#d8e1df" font-family="Arial" font-size="20">DATED INTEL</text>

</svg>
