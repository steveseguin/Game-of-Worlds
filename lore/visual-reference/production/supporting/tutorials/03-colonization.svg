<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>03 Colonization</title>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5H4" stroke="#b9d7d8" stroke-opacity=".08"/></pattern>
    <pattern id="stripe" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="18" fill="#e85d3f" fill-opacity=".28"/></pattern>
  </defs>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#46d4df"/></marker></defs>
  <rect width="960" height="540" rx="24" fill="#05080c"/>
  <rect x="14" y="14" width="932" height="512" rx="18" fill="#0a1117" stroke="#52656d" stroke-width="4"/>
  <rect width="960" height="540" fill="url(#scan)"/>
  <text x="48" y="70" fill="#d8e1df" font-family="Arial, sans-serif" font-size="34" font-weight="700">COLONIZATION</text>
  <text x="48" y="108" fill="#8fa3a8" font-family="Arial, sans-serif" font-size="20">World + Colony Ship + sufficient terraforming = permanent settlement.</text>
  <circle cx="180" cy="314" r="78" fill="#344a3c" stroke="#86a38c" stroke-width="7"/><path d="M320 270L388 314 320 358Z" fill="#d8e1df"/><rect x="388" y="286" width="92" height="56" rx="12" fill="#26343b" stroke="#46d4df" stroke-width="5"/><path d="M536 314H648" stroke="#46d4df" stroke-width="7"/><path d="M710 386Q770 228 830 386Z" fill="#26343b" stroke="#d5b76a" stroke-width="7"/><rect x="744" y="302" width="52" height="84" fill="#566b70"/><text x="682" y="430" fill="#d8e1df" font-family="Arial" font-size="22">COLONY CONFIRMED</text>

</svg>
