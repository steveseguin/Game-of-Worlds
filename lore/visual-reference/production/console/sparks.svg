<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Sparks</title>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5H4" stroke="#b9d7d8" stroke-opacity=".08"/></pattern>
    <pattern id="stripe" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="18" fill="#e85d3f" fill-opacity=".28"/></pattern>
  </defs>
  <g stroke="#ffb14a" stroke-width="5" stroke-linecap="round" filter="url(#glow)"><path d="M50 60L98 112" stroke-dasharray="0 80"><animate attributeName="stroke-dasharray" values="0 80;22 58;0 80" dur=".7s" repeatCount="indefinite"/></path><path d="M132 42L118 112" stroke-dasharray="0 80"><animate attributeName="stroke-dasharray" values="0 80;18 62;0 80" dur=".9s" begin=".2s" repeatCount="indefinite"/></path><path d="M202 74L150 126" stroke-dasharray="0 80"><animate attributeName="stroke-dasharray" values="0 80;20 60;0 80" dur=".6s" begin=".35s" repeatCount="indefinite"/></path></g>
