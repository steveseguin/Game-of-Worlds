<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Signal Static</title>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5H4" stroke="#b9d7d8" stroke-opacity=".08"/></pattern>
    <pattern id="stripe" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="18" fill="#e85d3f" fill-opacity=".28"/></pattern>
  </defs>
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"><animate attributeName="seed" values="1;9;3;14;1" dur=".35s" repeatCount="indefinite"/></feTurbulence><feColorMatrix values="0 0 0 0 .2 0 0 0 0 .7 0 0 0 0 .45 0 0 0 .8 0"/></filter><rect width="256" height="256" filter="url(#noise)"/>
</svg>
