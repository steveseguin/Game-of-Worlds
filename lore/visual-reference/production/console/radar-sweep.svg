<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Radar Sweep</title>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5H4" stroke="#b9d7d8" stroke-opacity=".08"/></pattern>
    <pattern id="stripe" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="18" fill="#e85d3f" fill-opacity=".28"/></pattern>
  </defs>
  <circle cx="128" cy="128" r="100" fill="#46d4df" fill-opacity=".03" stroke="#46d4df" stroke-opacity=".35" stroke-width="3"/><path d="M128 128L128 28A100 100 0 0 1 214 178Z" fill="#46d4df" fill-opacity=".18"><animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="3s" repeatCount="indefinite"/></path>
</svg>
